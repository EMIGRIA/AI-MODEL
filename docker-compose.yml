services:
  emigria-ai-service:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: emigria-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./api/models:/app/api/models:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
